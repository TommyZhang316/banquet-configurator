<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄浦香港联谊会宴会桌型配置器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --gold-dim: #8B6914;
    --ink: #0E0D0B;
    --charcoal: #1A1916;
    --panel: #141310;
    --surface: #1F1D19;
    --border: rgba(201,168,76,0.18);
    --text: #F0EAD6;
    --muted: #8A8070;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(201,168,76,0.06) 0%, transparent 100%);
  }
  .logo {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
  }
  .logo span { color: var(--muted); }
  h1 {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.3em;
    color: var(--text);
    text-align: center;
  }
  h1 small { display: block; font-family: 'Noto Serif SC'; font-size: 11px; letter-spacing: 0.15em; color: var(--muted); margin-top: 3px; }

  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: calc(100vh - 69px);
  }

  .left-panel {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 28px 24px;
    max-height: calc(100vh - 69px);
  }
  .left-panel::-webkit-scrollbar { width: 4px; }
  .left-panel::-webkit-scrollbar-track { background: transparent; }
  .left-panel::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

  .section { margin-bottom: 30px; }
  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .section-subtitle { font-size: 11px; color: var(--muted); margin-bottom: 12px; letter-spacing: 0.05em; }

  .swatch-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
    gap: 8px;
  }
  .swatch {
    cursor: pointer;
    border-radius: 6px;
    border: 1.5px solid transparent;
    overflow: hidden;
    transition: all 0.2s;
    position: relative;
  }
  .swatch:hover { border-color: var(--gold-dim); transform: translateY(-1px); }
  .swatch.active { border-color: var(--gold); box-shadow: 0 0 10px rgba(201,168,76,0.35); }
  .swatch-color { height: 42px; width: 100%; position: relative; overflow: hidden; }
  .swatch-label {
    background: rgba(14,13,11,0.85);
    padding: 4px 5px;
    font-size: 9px;
    letter-spacing: 0.04em;
    color: var(--text);
    text-align: center;
    line-height: 1.3;
  }
  .swatch.active .swatch-label { color: var(--gold-light); }
  .check-mark {
    display: none;
    position: absolute;
    top: 3px; right: 3px;
    background: var(--gold);
    color: var(--ink);
    border-radius: 50%;
    width: 14px; height: 14px;
    font-size: 9px;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
  .swatch.active .check-mark { display: flex; }

  .flower-type-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .ftab {
    padding: 4px 11px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 10px;
    cursor: pointer;
    color: var(--muted);
    letter-spacing: 0.06em;
    transition: all 0.2s;
    background: transparent;
  }
  .ftab:hover { border-color: var(--gold-dim); color: var(--text); }
  .ftab.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.08); }
  .flower-colors { display: none; }
  .flower-colors.visible { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; }

  .right-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 32px 40px;
    background: var(--charcoal);
    position: relative;
    overflow: hidden;
  }
  .right-panel::before {
    content: '';
    position: absolute;
    top: -120px; left: 50%;
    transform: translateX(-50%);
    width: 700px; height: 700px;
    background: radial-gradient(ellipse, rgba(201,168,76,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .preview-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .preview-hint {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 16px;
    letter-spacing: 0.05em;
    font-style: italic;
  }

  #scene-container {
    width: min(620px, 100%);
    aspect-ratio: 1 / 1;
    max-height: calc(100vh - 360px);
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1a1713 0%, #0b0a08 100%);
    box-shadow: 0 25px 70px rgba(0,0,0,0.7), 0 0 0 1px rgba(201,168,76,0.15);
  }
  #scene-container canvas { display: block; width: 100% !important; height: 100% !important; }

  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-family: 'Cinzel', serif;
    letter-spacing: 0.3em;
    font-size: 11px;
    z-index: 5;
    background: rgba(14,13,11,0.95);
    transition: opacity 0.5s;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }

  .summary-card {
    margin-top: 20px;
    width: min(620px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 22px;
  }
  .summary-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold);
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px 20px;
  }
  .summary-item { display: flex; flex-direction: column; gap: 2px; }
  .summary-item-label {
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .summary-item-value { font-size: 12px; color: var(--text); font-style: italic; }
  .summary-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"

}

</head>
<body>

<header>
  <div class="logo">Grand Ballroom <span>· 宴会厅</span></div>
  <h1>黄浦香港联谊会<small>宴会桌型配置器 · Banquet Table Configurator</small></h1>
  <div class="logo" style="opacity:0">–</div>
</header>

<div class="layout">

  <div class="left-panel">

    <div class="section">
      <div class="section-title">Table Linen</div>
      <div class="section-subtitle">桌布选择</div>
      <div class="swatch-grid" id="linen-grid"></div>
    </div>

    <div class="section">
      <div class="section-title">Seat Cover</div>
      <div class="section-subtitle">椅套选择</div>
      <div class="swatch-grid" id="seat-grid"></div>
    </div>

    <div class="section">
      <div class="section-title">Show Plate</div>
      <div class="section-subtitle">展示盘</div>
      <div class="swatch-grid" id="plate-grid"></div>
    </div>

    <div class="section">
      <div class="section-title">Napkin</div>
      <div class="section-subtitle">餐巾颜色</div>
      <div class="swatch-grid" id="napkin-grid"></div>
    </div>

    <div class="section">
      <div class="section-title">Napkin Ring</div>
      <div class="section-subtitle">餐巾环</div>
      <div class="swatch-grid" id="ring-grid"></div>
    </div>

    <div class="section">
      <div class="section-title">Centerpiece</div>
      <div class="section-subtitle">桌花摆设</div>
      <div class="flower-type-tabs" id="flower-tabs"></div>
      <div id="flower-color-container"></div>
    </div>

  </div>

  <div class="right-panel">
    <div class="preview-label">3D 实时预览 · Live 3D Preview</div>
    <div class="preview-hint">拖动旋转 · 滚轮缩放 · Drag to rotate · Scroll to zoom</div>

    <div id="scene-container">
      <div class="loading" id="loading">Loading 3D Scene…</div>
    </div>

    <div class="summary-card">
      <div class="summary-title">当前配置 · Current Selection</div>
      <div class="summary-grid" id="summary-grid"></div>
    </div>
  </div>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ═══════════════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════════════
const DATA = {
  linen: [
    { id:'purple-organza',    label:'Purple Organza\n紫色欧根',  bg:0x7B5EA7, shimmer:0xC9B3E8, type:'organza' },
    { id:'silver-organza',    label:'Silver Organza\n银色欧根',  bg:0xA8ADB6, shimmer:0xE8EBF0, type:'organza' },
    { id:'gold-organza',      label:'Gold Organza\n金色欧根',    bg:0xC9A84C, shimmer:0xF0D97A, type:'organza' },
    { id:'champagne-pattern', label:'Champagne\n香槟花纹',       bg:0xD4B896, shimmer:0xF5E8D4, type:'brocade' },
    { id:'gold-solid',        label:'Gold\n金',                   bg:0xB8922E, shimmer:0xE0B84A, type:'solid' },
    { id:'ruby',              label:'Ruby\n宝石红',               bg:0x8B1A2B, shimmer:0xC44759, type:'solid' },
    { id:'violet',            label:'Violet\n紫罗兰',             bg:0x5A3A8C, shimmer:0x8E5FB8, type:'solid' },
  ],
  seat: [
    { id:'white-spandex', label:'White Spandex\n白色弹力', color:0xF5F0E8 },
    { id:'gold-crepe',    label:'Gold Crepe\n金色皱纹',    color:0xC9A84C },
    { id:'purple',        label:'Purple\n紫色',             color:0x6B4A8C },
    { id:'burgundy',      label:'Burgundy\n酒红',           color:0x6B2737 },
    { id:'silver-crepe',  label:'Silver Crepe\n银色皱纹',   color:0xA8AEBB },
  ],
  plate: [
    { id:'plate-red',   label:'Red\n红色',      rim:0xC0392B, inner:0xF8F4EE },
    { id:'plate-gold',  label:'Gold Rim\n金边', rim:0xC9A84C, inner:0xFDFAF4 },
    { id:'plate-beige', label:'Beige Trim\n米边',rim:0xC4A882, inner:0xFBF8F2 },
    { id:'plate-silver',label:'Silver\n银色',   rim:0xA8ADB6, inner:0xFAFAFA },
  ],
  napkin: [
    { id:'napkin-ivory',    label:'Ivory\n象牙白',  color:0xF5F0E0 },
    { id:'napkin-white',    label:'White\n白色',    color:0xFFFFFF },
    { id:'napkin-burgundy', label:'Burgundy\n酒红', color:0x7B2538 },
  ],
  napkinRing: [
    { id:'ring-goldpearl', label:'Gold Pearl\n金珍珠',    metal:0xd4b05a, accent:0xfdfaf2, style:'pearl' },
    { id:'ring-whitegold', label:'White Gold Cube\n白金方', metal:0xe8e4d8, accent:0xd4b05a, style:'cube' },
    { id:'ring-silver',    label:'Silver Knot\n银结',     metal:0xc8cbd2, accent:0xa8adb6, style:'knot' },
  ],
  flowers: {
    'Mokara 莫卡拉': [
      { id:'mok-red',    label:'Red\n红',    color:0xC0392B },
      { id:'mok-pink',   label:'Pink\n粉',   color:0xE87CA0 },
      { id:'mok-purple', label:'Purple\n紫', color:0x8E44AD },
      { id:'mok-yellow', label:'Yellow\n黄', color:0xF1C40F },
      { id:'mok-orange', label:'Orange\n橙', color:0xE67E22 },
    ],
    'Hydrangea 绣球': [
      { id:'hyd-pink',   label:'Pink\n粉',        color:0xE87CA0 },
      { id:'hyd-white',  label:'White\n白',        color:0xF2F0EC },
      { id:'hyd-blue',   label:'Blue\n蓝',         color:0x4A90D9 },
      { id:'hyd-lpurple',label:'Light Purple\n浅紫',color:0xB39DDB },
    ],
    'Rose 玫瑰': [
      { id:'ros-red',    label:'Red\n红',           color:0xC0392B },
      { id:'ros-pink',   label:'Pink\n粉',          color:0xE87CA0 },
      { id:'ros-white',  label:'White\n白',         color:0xF2F0EC },
      { id:'ros-yellow', label:'Yellow\n黄',        color:0xF1C40F },
      { id:'ros-champ',  label:'Champagne\n香槟',   color:0xD4B896 },
      { id:'ros-lpurple',label:'Light Purple\n浅紫',color:0xCE93D8 },
    ],
    'Rose Float 浮玫瑰': [
      { id:'rosf-red',   label:'Red\n红',     color:0xC0392B },
      { id:'rosf-pink',  label:'Pink\n粉',    color:0xE87CA0 },
      { id:'rosf-white', label:'White\n白',   color:0xF2F0EC },
      { id:'rosf-yellow',label:'Yellow\n黄',  color:0xF1C40F },
      { id:'rosf-champ', label:'Champagne\n香槟',color:0xD4B896 },
    ],
  }
};

const state = {
  linen: DATA.linen[2],
  seat:  DATA.seat[0],
  plate: DATA.plate[1],
  napkin: DATA.napkin[0],
  napkinRing: DATA.napkinRing[0],
  flower: DATA.flowers['Rose 玫瑰'][0],
  flowerType: 'Rose 玫瑰',
};

// ═══════════════════════════════════════════════════════════
//  THREE.JS SETUP
// ═══════════════════════════════════════════════════════════
const container = document.getElementById('scene-container');
const scene = new THREE.Scene();
scene.background = null;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(2.2, 1.8, 2.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.75, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 2.2;
controls.maxDistance = 6;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;

// Lights — warm chandelier ballroom atmosphere
const ambient = new THREE.AmbientLight(0xfff2dd, 0.35);
scene.add(ambient);

const keyLight = new THREE.SpotLight(0xffdfa8, 2.6, 10, Math.PI/3.5, 0.55, 1.3);
keyLight.position.set(0, 4.5, 0.3);
keyLight.target.position.set(0, 0.7, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0005;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 10;
scene.add(keyLight, keyLight.target);

const fillWarm = new THREE.PointLight(0xffc877, 0.8, 8, 2);
fillWarm.position.set(2.5, 1.8, 2);
scene.add(fillWarm);

const fillCool = new THREE.PointLight(0xaac2e8, 0.25, 8, 2);
fillCool.position.set(-2.5, 2, -1.5);
scene.add(fillCool);

// Rim light from behind
const rimLight = new THREE.DirectionalLight(0xffe0b0, 0.4);
rimLight.position.set(-2, 3, -3);
scene.add(rimLight);

// Floor — patterned carpet feel
const floorGeo = new THREE.CircleGeometry(5, 64);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x3a2a20, roughness: 0.95, metalness: 0 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// Subtle decorative floor ring
const ringGeo = new THREE.RingGeometry(1.5, 1.52, 64);
const ringMat = new THREE.MeshStandardMaterial({ color: 0x5a3f28, roughness: 0.8, transparent:true, opacity:0.6 });
const floorRing = new THREE.Mesh(ringGeo, ringMat);
floorRing.rotation.x = -Math.PI/2;
floorRing.position.y = 0.001;
scene.add(floorRing);

// ═══════════════════════════════════════════════════════════
//  MATERIAL FACTORIES
// ═══════════════════════════════════════════════════════════
function makeLinenMaterial(item) {
  if (item.type === 'organza') {
    return new THREE.MeshPhysicalMaterial({
      color: item.bg,
      roughness: 0.42,
      metalness: 0.15,
      sheen: 1,
      sheenColor: new THREE.Color(item.shimmer),
      sheenRoughness: 0.25,
      clearcoat: 0.12,
      clearcoatRoughness: 0.4,
      iridescence: 0.15,
      iridescenceIOR: 1.4,
    });
  }
  if (item.type === 'solid') {
    // Solid satin/silk finish — rich color, subtle sheen
    return new THREE.MeshPhysicalMaterial({
      color: item.bg,
      roughness: 0.55,
      metalness: 0.1,
      sheen: 0.85,
      sheenColor: new THREE.Color(item.shimmer),
      sheenRoughness: 0.45,
      clearcoat: 0.08,
    });
  }
  // Champagne brocade: procedural canvas texture
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const base = '#' + item.bg.toString(16).padStart(6,'0');
  const acc = '#' + item.shimmer.toString(16).padStart(6,'0');
  ctx.fillStyle = base; ctx.fillRect(0,0,512,512);
  ctx.strokeStyle = acc; ctx.globalAlpha = 0.55;
  ctx.lineWidth = 1.4;
  for (let y = 0; y < 512; y += 48) {
    for (let x = 0; x < 512; x += 48) {
      ctx.beginPath();
      ctx.ellipse(x+24, y+24, 16, 10, Math.PI/4, 0, Math.PI*2);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x+24, y+24, 10, 6, -Math.PI/4, 0, Math.PI*2);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(x+24, y+24, 3, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = acc;
  for (let i=0; i<300; i++) {
    ctx.fillRect(Math.random()*512, Math.random()*512, 1, 1);
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshPhysicalMaterial({
    map: tex,
    color: 0xffffff,
    roughness: 0.55,
    metalness: 0.2,
    sheen: 0.7,
    sheenColor: new THREE.Color(item.shimmer),
    sheenRoughness: 0.35,
  });
}

function makeFabricMaterial(color, roughness = 0.75) {
  return new THREE.MeshPhysicalMaterial({
    color, roughness,
    metalness: 0.04,
    sheen: 0.4,
    sheenColor: new THREE.Color(color).multiplyScalar(1.2),
    sheenRoughness: 0.5,
  });
}

function makePlateMaterial(color, isRim = false) {
  return new THREE.MeshPhysicalMaterial({
    color,
    roughness: isRim ? 0.2 : 0.08,
    metalness: isRim ? 0.5 : 0.05,
    clearcoat: 1,
    clearcoatRoughness: 0.05,
  });
}

function makeGoldMetal() {
  return new THREE.MeshPhysicalMaterial({
    color: 0xd4b05a, roughness: 0.25, metalness: 0.9, clearcoat: 0.5
  });
}

function makeGlassMaterial() {
  return new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: 0.02, metalness: 0,
    transmission: 0.95, thickness: 0.15, ior: 1.5,
    transparent: true, opacity: 1
  });
}

// ═══════════════════════════════════════════════════════════
//  BUILDERS
// ═══════════════════════════════════════════════════════════
const TABLE_RADIUS = 1.05;
const TABLE_TOP_Y = 0.76;
const N_SEATS = 10;

// Table group (reusable, swap material)
const tableGroup = new THREE.Group();
scene.add(tableGroup);

let linenMat = makeLinenMaterial(state.linen);

// Tablecloth draped to floor (cone frustum with slight flare)
(function buildTable() {
  // Draped skirt
  const skirtGeo = new THREE.CylinderGeometry(TABLE_RADIUS + 0.04, TABLE_RADIUS + 0.12, TABLE_TOP_Y + 0.02, 72, 1, true);
  // Add vertex noise for fabric drape
  const pos = skirtGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const angle = Math.atan2(z, x);
    const verticalFactor = (TABLE_TOP_Y/2 - y) / TABLE_TOP_Y; // 0 top, 1 bottom
    const waveFactor = verticalFactor * 0.5;
    const wave = Math.sin(angle * 14) * 0.015 * waveFactor + Math.cos(angle * 7) * 0.008 * waveFactor;
    const r = Math.sqrt(x*x + z*z);
    const nr = r + wave;
    pos.setX(i, Math.cos(angle) * nr);
    pos.setZ(i, Math.sin(angle) * nr);
  }
  skirtGeo.computeVertexNormals();
  const skirt = new THREE.Mesh(skirtGeo, linenMat);
  skirt.name = 'skirt';
  skirt.position.y = TABLE_TOP_Y/2;
  skirt.castShadow = true;
  skirt.receiveShadow = true;
  tableGroup.add(skirt);

  // Table top (slight dome for cloth)
  const topGeo = new THREE.CircleGeometry(TABLE_RADIUS + 0.04, 72);
  const topPos = topGeo.attributes.position;
  for (let i = 0; i < topPos.count; i++) {
    const x = topPos.getX(i), y = topPos.getY(i);
    const r = Math.sqrt(x*x + y*y);
    // Slight bowl curvature
    topPos.setZ(i, -r*r*0.008);
  }
  topGeo.computeVertexNormals();
  const top = new THREE.Mesh(topGeo, linenMat);
  top.name = 'top';
  top.rotation.x = -Math.PI/2;
  top.position.y = TABLE_TOP_Y + 0.001;
  top.receiveShadow = true;
  tableGroup.add(top);

  // Overlay runner/underlay for depth (darker ring at edge)
  const edgeGeo = new THREE.RingGeometry(TABLE_RADIUS - 0.02, TABLE_RADIUS + 0.04, 72);
  const edgeMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.15 });
  const edge = new THREE.Mesh(edgeGeo, edgeMat);
  edge.rotation.x = -Math.PI/2;
  edge.position.y = TABLE_TOP_Y + 0.002;
  tableGroup.add(edge);
})();

function buildChair(mat) {
  const g = new THREE.Group();

  // Bottom drape (slipcover to floor)
  const drapeGeo = new THREE.CylinderGeometry(0.28, 0.32, 0.48, 24, 1, true);
  // Slight ripples
  const dp = drapeGeo.attributes.position;
  for (let i = 0; i < dp.count; i++) {
    const x = dp.getX(i), y = dp.getY(i), z = dp.getZ(i);
    const angle = Math.atan2(z, x);
    const vf = (0.24 - y) / 0.48;
    const wave = Math.sin(angle * 10) * 0.012 * vf;
    const r = Math.sqrt(x*x + z*z) + wave;
    dp.setX(i, Math.cos(angle) * r);
    dp.setZ(i, Math.sin(angle) * r);
  }
  drapeGeo.computeVertexNormals();
  const drape = new THREE.Mesh(drapeGeo, mat);
  drape.position.y = 0.24;

  const seat = new THREE.Mesh(seatGeo, mat);
  seat.position.y = 0.51;
  seat.castShadow = true;
  g.add(seat);

  // Chair back (rounded rectangular)
  const backGeo = new THREE.BoxGeometry(0.48, 0.6, 0.08);

    color: 0xd4b05a, roughness: 0.3, metalness: 0.6, sheen: 0.5, sheenColor: new THREE.Color(0xf0d97a)
  });

function buildNapkinRingInto(container, ringItem) {
  // Clear existing
  while (container.children.length) {
    const c = container.children[0];
    container.remove(c);
    c.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
    });
  }
  const metalMat = new THREE.MeshPhysicalMaterial({
    color: ringItem.metal, roughness: 0.18, metalness: 0.95, clearcoat: 0.7, clearcoatRoughness: 0.1
  });
  const accentMat = new THREE.MeshPhysicalMaterial({
    color: ringItem.accent, roughness: 0.25, metalness: 0.7, clearcoat: 0.5
  });

  if (ringItem.style === 'pearl') {
    // Gold band with pearl cluster
    const ringGeo = new THREE.TorusGeometry(0.04, 0.01, 16, 32);
    const ring = new THREE.Mesh(ringGeo, metalMat);
    ring.rotation.y = Math.PI / 2;
    container.add(ring);
    // 3 pearls on top
    const pearlMat = new THREE.MeshPhysicalMaterial({
      color: ringItem.accent, roughness: 0.1, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.05,
      sheen: 1, sheenColor: 0xffffff, sheenRoughness: 0.15, iridescence: 0.3
    });
    for (let i = 0; i < 3; i++) {
      const p = new THREE.Mesh(new THREE.SphereGeometry(0.011, 16, 12), pearlMat);
      p.position.set((i - 1) * 0.018, 0.045, 0);
      container.add(p);
    }
  } else if (ringItem.style === 'cube') {
    // White gold cube-shaped band (square cross-section ring)
    const w = 0.09, h = 0.022, t = 0.012;
    // Top and bottom bars
    const barGeo = new THREE.BoxGeometry(w, t, 0.05);
    const top = new THREE.Mesh(barGeo, metalMat);
    top.position.y = h / 2;
    container.add(top);
    const bot = new THREE.Mesh(barGeo, metalMat);
    bot.position.y = -h / 2;
    container.add(bot);
    // Side bars
    const sideGeo = new THREE.BoxGeometry(t, h, 0.05);
    const left = new THREE.Mesh(sideGeo, metalMat);
    left.position.x = -w / 2 + t / 2;
    container.add(left);
    const right = new THREE.Mesh(sideGeo, metalMat);
    right.position.x = w / 2 - t / 2;
    container.add(right);
    // Center gold accent
    const accGeo = new THREE.BoxGeometry(0.018, 0.018, 0.01);
    const acc = new THREE.Mesh(accGeo, accentMat);
    acc.position.set(0, 0, 0.028);
    acc.rotation.z = Math.PI / 4;
    container.add(acc);
  } else if (ringItem.style === 'knot') {
    // Silver torus knot
    const knotGeo = new THREE.TorusKnotGeometry(0.028, 0.008, 64, 12, 2, 3);
    const knot = new THREE.Mesh(knotGeo, metalMat);
    knot.rotation.y = Math.PI / 2;
    container.add(knot);
  }
}

function rose3D(color, size = 0.05) {
  const g = new THREE.Group();
  const mat = new THREE.MeshPhysicalMaterial({
    color, roughness: 0.55, metalness: 0.02,
    sheen: 0.6, sheenColor: new THREE.Color(color).multiplyScalar(1.15), sheenRoughness: 0.4
  });
  for (let layer = 0; layer < 4; layer++) {
    const lr = size * (1 - layer * 0.15);
    const count = Math.max(3, 6 - layer);
    for (let i = 0; i < count; i++) {
      const a = (i/count) * Math.PI * 2 + layer * 0.35;
      const petalGeo = new THREE.SphereGeometry(lr * 0.55, 10, 6);
      const petal = new THREE.Mesh(petalGeo, mat);
      petal.position.set(
        Math.cos(a) * lr * 0.5,
        layer * lr * 0.18,
        Math.sin(a) * lr * 0.5
      );
      petal.scale.set(1, 0.55, 1);
      petal.rotation.y = a;
      petal.rotation.z = 0.3;
      petal.castShadow = true;
      g.add(petal);
    }
  }
  const centerGeo = new THREE.SphereGeometry(size * 0.25, 12, 8);
  const center = new THREE.Mesh(centerGeo, mat);
  center.position.y = size * 0.4;
  g.add(center);
  return g;
}

function hydrangeaFloret(color, size = 0.035) {
  const g = new THREE.Group();
  const mat = new THREE.MeshPhysicalMaterial({
    color, roughness: 0.6, sheen: 0.3, sheenColor: 0xffffff
  });
  for (let i = 0; i < 4; i++) {
    const a = (i/4) * Math.PI * 2;
    const petalGeo = new THREE.SphereGeometry(size * 0.55, 8, 5);
    const petal = new THREE.Mesh(petalGeo, mat);
    petal.position.set(Math.cos(a) * size * 0.4, 0, Math.sin(a) * size * 0.4);
    petal.scale.set(1, 0.4, 1);
    g.add(petal);
  }
  const cGeo = new THREE.SphereGeometry(size * 0.18, 8, 6);
  const c = new THREE.Mesh(cGeo, new THREE.MeshStandardMaterial({ color: 0xf5e89a }));
  g.add(c);
  return g;
}

function mokaraStem(color) {
  const g = new THREE.Group();
  const mat = new THREE.MeshPhysicalMaterial({
    color, roughness: 0.5, sheen: 0.8, sheenColor: new THREE.Color(color).multiplyScalar(1.3)
  });
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.8 });
  // Main stem
  const stemGeo = new THREE.CylinderGeometry(0.005, 0.006, 0.28, 8);
  const stem = new THREE.Mesh(stemGeo, stemMat);
  stem.position.y = 0.14;
  g.add(stem);
  // Flowers along stem
  for (let i = 0; i < 5; i++) {
    const fg = new THREE.Group();
    for (let p = 0; p < 5; p++) {
      const a = p * (Math.PI * 2 / 5);
      const petalGeo = new THREE.SphereGeometry(0.022, 10, 6);
      const petal = new THREE.Mesh(petalGeo, mat);
      petal.position.set(Math.cos(a) * 0.015, 0, Math.sin(a) * 0.015);
      petal.scale.set(1.3, 0.4, 0.7);
      petal.rotation.y = a;
      fg.add(petal);
    }
    const cGeo = new THREE.SphereGeometry(0.008, 10, 6);
    const cMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f });
    const c = new THREE.Mesh(cGeo, cMat);
    fg.add(c);
    fg.position.y = 0.07 + i * 0.045;
    fg.rotation.y = i * 0.6;
    g.add(fg);
  }
  return g;
}

function leafGeometry() {
  const mat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.8, side: THREE.DoubleSide });
  return { mat };
}

function buildCenterpiece() {
  const g = new THREE.Group();
  const type = state.flowerType;
  const color = state.flower.color;

  if (type.includes('Float')) {
    // Silver water bowl + floating roses
    const bowlGeo = new THREE.CylinderGeometry(0.22, 0.16, 0.09, 32);
    const bowlMat = new THREE.MeshPhysicalMaterial({
      color: 0xc9c9c9, roughness: 0.15, metalness: 0.9, clearcoat: 0.4

    bowl.position.y = TABLE_TOP_Y + 0.045;
    bowl.castShadow = true;
    g.add(bowl);
    // Water
    const waterGeo = new THREE.CylinderGeometry(0.215, 0.215, 0.01, 32);
    const waterMat = new THREE.MeshPhysicalMaterial({
      color: 0x557799, roughness: 0.02, metalness: 0,
      transmission: 0.8, thickness: 0.2, ior: 1.33, transparent: true, opacity: 0.85
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = TABLE_TOP_Y + 0.085;
    g.add(water);
    // 4 floating roses + candles
    for (let i = 0; i < 4; i++) {
      const a = (i/4) * Math.PI * 2;
      const rose = rose3D(color, 0.06);
      rose.position.set(Math.cos(a) * 0.11, TABLE_TOP_Y + 0.09, Math.sin(a) * 0.11);
      rose.scale.y = 0.5;
      g.add(rose);
    }
    // Floating petals
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 0.05 + Math.random() * 0.14;
      const petalGeo = new THREE.SphereGeometry(0.015, 8, 5);
      const petal = new THREE.Mesh(petalGeo, new THREE.MeshStandardMaterial({ color }));
      petal.scale.set(1.4, 0.2, 0.8);
      petal.position.set(Math.cos(a) * r, TABLE_TOP_Y + 0.088, Math.sin(a) * r);
      petal.rotation.y = Math.random() * Math.PI;
      g.add(petal);
    }
  } else if (type.includes('Hydrangea')) {
    // Tall crystal/glass pedestal
    const pedGeo = new THREE.CylinderGeometry(0.06, 0.09, 0.35, 24);
    const pedMat = makeGlassMaterial();
    const ped = new THREE.Mesh(pedGeo, pedMat);
    ped.position.y = TABLE_TOP_Y + 0.18;
    g.add(ped);
    // Dome cluster on top
    const cluster = new THREE.Group();
    const baseGeo = new THREE.SphereGeometry(0.14, 20, 14);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.8 });
    const base = new THREE.Mesh(baseGeo, baseMat);
    cluster.add(base);
    // Florets on upper hemisphere
    for (let i = 0; i < 90; i++) {
      const phi = Math.acos(1 - Math.random() * 1.3);
      const theta = Math.random() * Math.PI * 2;
      const r = 0.145;
      const floret = hydrangeaFloret(color, 0.04 + Math.random() * 0.015);
      const x = r * Math.sin(phi) * Math.cos(theta);
      const y = r * Math.cos(phi);
      const z = r * Math.sin(phi) * Math.sin(theta);
      floret.position.set(x, y, z);
      floret.lookAt(x*3, y*3, z*3);
      cluster.add(floret);
    }
    cluster.position.y = TABLE_TOP_Y + 0.4;
    g.add(cluster);
  } else if (type.includes('Mokara')) {
    // Tall gold vase + orchid sprays
    const vaseGeo = new THREE.CylinderGeometry(0.07, 0.05, 0.32, 24);
    const vaseMat = makeGoldMetal();
    const vase = new THREE.Mesh(vaseGeo, vaseMat);
    vase.position.y = TABLE_TOP_Y + 0.16;
    vase.castShadow = true;
    g.add(vase);
    // Multiple stems radiating
    for (let i = 0; i < 7; i++) {
      const a = (i/7) * Math.PI * 2;
      const stem = mokaraStem(color);
      stem.position.set(Math.cos(a)*0.02, TABLE_TOP_Y + 0.32, Math.sin(a)*0.02);
      stem.rotation.y = a;
      stem.rotation.z = 0.25;
      g.add(stem);
    }
    // Few greenery filler leaves
    const { mat: leafMat } = leafGeometry();
    for (let i = 0; i < 8; i++) {
      const a = (i/8) * Math.PI * 2 + 0.2;
      const lGeo = new THREE.SphereGeometry(0.04, 8, 5);
      const leaf = new THREE.Mesh(lGeo, leafMat);
      leaf.scale.set(2.5, 0.3, 0.8);
      leaf.position.set(Math.cos(a)*0.06, TABLE_TOP_Y + 0.33, Math.sin(a)*0.06);
      leaf.rotation.y = a;
      leaf.rotation.z = 0.4;
      g.add(leaf);
    }
  } else {
    // Rose bouquet in crystal footed bowl
    const footGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.04, 24);
    const footMat = makeGlassMaterial();
    const foot = new THREE.Mesh(footGeo, footMat);
    foot.position.y = TABLE_TOP_Y + 0.02;
    g.add(foot);
    const stemG = new THREE.CylinderGeometry(0.025, 0.025, 0.08, 16);
    const stem = new THREE.Mesh(stemG, footMat);
    stem.position.y = TABLE_TOP_Y + 0.06;
    g.add(stem);
    const bowlG = new THREE.CylinderGeometry(0.14, 0.09, 0.1, 24);
    const bowl = new THREE.Mesh(bowlG, footMat);
    bowl.position.y = TABLE_TOP_Y + 0.15;
    g.add(bowl);
    // Greenery in bowl
    const { mat: leafMat } = leafGeometry();
    for (let i = 0; i < 10; i++) {
      const a = (i/10) * Math.PI * 2;
      const lGeo = new THREE.SphereGeometry(0.035, 8, 5);
      const leaf = new THREE.Mesh(lGeo, leafMat);
      leaf.scale.set(2.2, 0.4, 0.8);
      leaf.position.set(Math.cos(a)*0.08, TABLE_TOP_Y + 0.2, Math.sin(a)*0.08);
      leaf.rotation.y = a;
      leaf.rotation.z = 0.5;
      g.add(leaf);
    }
    // Rose dome
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.1;
      const h = 0.21 + Math.random() * 0.04;
      const rose = rose3D(color, 0.058);
      rose.position.set(Math.cos(a)*r, TABLE_TOP_Y + h, Math.sin(a)*r);
      rose.rotation.y = Math.random() * Math.PI * 2;
      g.add(rose);
    }
    // Filler roses at edge (shifted color)
    const fillerColor = new THREE.Color(color).multiplyScalar(1.2).getHex();
  }

  return g;
}

function updateLinen() {
  const newMat = makeLinenMaterial(state.linen);
  if (linenMat) linenMat.dispose();
  linenMat = newMat;
  tableGroup.children.forEach(c => {
    if (c.name === 'skirt' || c.name === 'top') c.material = linenMat;
  });
}

function updateChairs() {
  const mat = makeFabricMaterial(state.seat.color);
  chairsGroup.children.forEach(chair => {
    chair.traverse(obj => {
      if (obj.isMesh && obj.material && !obj.material.userData.isSash) {
        // Identify by material vs sash (gold)
        const col = obj.material.color;
        if (col && (col.r*255 > 200 && col.g*255 > 150 && col.b*255 < 120 && obj.material.metalness > 0.5)) return;
        obj.material = mat;
      }
    });
  });
}

function updatePlatesAndNapkins() {
  const chargerMat = makePlateMaterial(state.plate.rim, true);
  const plateMat = makePlateMaterial(state.plate.inner, false);
  const napkinMat = makeFabricMaterial(state.napkin.color, 0.85);

  placesGroup.children.forEach(ps => {
    ps.traverse(obj => {
      if (obj.name === 'charger') obj.material = chargerMat;
      else if (obj.name === 'plate' || obj.name === 'bowl') obj.material = plateMat;
    });
    const napGroup = ps.children.find(c => c.name === 'napkin');
    if (napGroup) {
      napGroup.children.forEach(ch => {
        if (ch.geometry && ch.geometry.type === 'BoxGeometry') ch.material = napkinMat;
      });
    }
  });
}

function updateNapkinRings() {
  placesGroup.children.forEach(ps => {
    const napGroup = ps.children.find(c => c.name === 'napkin');
    if (!napGroup) return;
    const ringContainer = napGroup.children.find(c => c.name === 'ringContainer');
    if (ringContainer) buildNapkinRingInto(ringContainer, state.napkinRing);
  });
}

function updateCenterpiece() {
  scene.remove(centerpieceGroup);
  centerpieceGroup.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  });
  centerpieceGroup = buildCenterpiece();
  scene.add(centerpieceGroup);
}

// ═══════════════════════════════════════════════════════════
//  UI
// ═══════════════════════════════════════════════════════════
function colorToHex(c) { return '#' + c.toString(16).padStart(6,'0'); }

function renderSummary() {
  const grid = document.getElementById('summary-grid');
  const items = [
    { label:'桌布 Linen', value: state.linen.label.split('\n')[0], color: colorToHex(state.linen.bg) },
    { label:'椅套 Seat', value: state.seat.label.split('\n')[0], color: colorToHex(state.seat.color) },
    { label:'展示盘 Plate', value: state.plate.label.split('\n')[0], color: colorToHex(state.plate.rim) },
    { label:'餐巾 Napkin', value: state.napkin.label.split('\n')[0], color: colorToHex(state.napkin.color) },
    { label:'餐巾环 Ring', value: state.napkinRing.label.split('\n')[0], color: colorToHex(state.napkinRing.metal) },
    { label:'桌花 Centerpiece', value: `${state.flowerType.split(' ')[0]} · ${state.flower.label.split('\n')[0]}`, color: colorToHex(state.flower.color) },
  ];
  grid.innerHTML = items.map(it => `
    <div class="summary-item">
      <div class="summary-item-label">${it.label}</div>
      <div class="summary-item-value">
        <span class="summary-dot" style="background:${it.color};box-shadow:0 0 4px ${it.color}55"></span>${it.value}
      </div>
    </div>
  `).join('');
}

function createSwatch(item, onClick) {
  const sw = document.createElement('div');
  sw.className = 'swatch';
  const lines = item.label.split('\n');
  sw.innerHTML = `
    <div class="swatch-color"></div>
    <div class="swatch-label">${lines[0]}<br><span style="opacity:0.65;font-size:8px">${lines[1]||''}</span></div>
    <div class="check-mark">✓</div>
  `;
  sw.addEventListener('click', onClick);
  return sw;
}

function activateSwatch(gridId, itemId) {
  document.querySelectorAll(`#${gridId} .swatch`).forEach(s => s.classList.remove('active'));
  const target = document.getElementById('sw-' + itemId);
  if (target) target.classList.add('active');
}

function buildLinenSwatches() {
  const grid = document.getElementById('linen-grid');
  DATA.linen.forEach(item => {
    const sw = createSwatch(item, () => {
      state.linen = item; updateLinen(); renderSummary();
      activateSwatch('linen-grid', item.id);
    });
    const bg = colorToHex(item.bg);
    const shim = colorToHex(item.shimmer);
    if (item.type === 'organza') {
      sw.querySelector('.swatch-color').style.background =
        `linear-gradient(135deg, ${shim} 0%, ${bg} 40%, ${shim} 70%, ${bg} 100%)`;
    } else if (item.type === 'brocade') {
      sw.querySelector('.swatch-color').style.background =
        `repeating-linear-gradient(45deg, ${bg}, ${bg} 4px, ${shim} 4px, ${shim} 8px)`;
    } else {
      // solid satin
      sw.querySelector('.swatch-color').style.background =
        `radial-gradient(ellipse at 35% 30%, ${shim} 0%, ${bg} 60%, ${bg} 100%)`;
    }
    sw.id = 'sw-' + item.id;
    if (item.id === state.linen.id) sw.classList.add('active');
    grid.appendChild(sw);
  });
}

function buildSeatSwatches() {
  const grid = document.getElementById('seat-grid');
  DATA.seat.forEach(item => {
    const sw = createSwatch(item, () => {
      state.seat = item; updateChairs(); renderSummary();
      activateSwatch('seat-grid', item.id);
    });
    sw.querySelector('.swatch-color').style.background = colorToHex(item.color);
    sw.id = 'sw-' + item.id;
    if (item.id === state.seat.id) sw.classList.add('active');
    grid.appendChild(sw);
  });
}

function buildPlateSwatches() {
  const grid = document.getElementById('plate-grid');
  DATA.plate.forEach(item => {
    const sw = createSwatch(item, () => {
      state.plate = item; updatePlatesAndNapkins(); renderSummary();
      activateSwatch('plate-grid', item.id);
    });
    const sc = sw.querySelector('.swatch-color');
    sc.style.background = colorToHex(item.inner);
    const rimDiv = document.createElement('div');
    rimDiv.style.cssText = `position:absolute;inset:0;border:5px solid ${colorToHex(item.rim)};border-radius:50%;margin:6px;`;
    sc.appendChild(rimDiv);
    sw.id = 'sw-' + item.id;
    if (item.id === state.plate.id) sw.classList.add('active');
    grid.appendChild(sw);
  });
}

function buildNapkinSwatches() {
  const grid = document.getElementById('napkin-grid');
  DATA.napkin.forEach(item => {
    const sw = createSwatch(item, () => {
      state.napkin = item; updatePlatesAndNapkins(); renderSummary();
      activateSwatch('napkin-grid', item.id);
    });
    sw.querySelector('.swatch-color').style.background = colorToHex(item.color);
    sw.id = 'sw-' + item.id;
    if (item.id === state.napkin.id) sw.classList.add('active');
    grid.appendChild(sw);
  });
}

function buildNapkinRingSwatches() {
  const grid = document.getElementById('ring-grid');
  DATA.napkinRing.forEach(item => {
    const sw = createSwatch(item, () => {
      state.napkinRing = item; updateNapkinRings(); renderSummary();
      activateSwatch('ring-grid', item.id);
    });
    const sc = sw.querySelector('.swatch-color');
    const metal = colorToHex(item.metal);
    const accent = colorToHex(item.accent);
    if (item.style === 'pearl') {
      sc.style.background = `radial-gradient(circle at 30% 40%, ${accent} 0%, ${accent} 8%, ${metal} 20%, ${metal} 100%)`;
    } else if (item.style === 'cube') {
      sc.style.background = `linear-gradient(135deg, ${metal} 0%, ${metal} 40%, ${accent} 50%, ${metal} 60%, ${metal} 100%)`;
    } else {
      sc.style.background = `conic-gradient(from 45deg, ${metal}, ${accent}, ${metal}, ${accent}, ${metal})`;
    }
    sw.id = 'sw-' + item.id;
    if (item.id === state.napkinRing.id) sw.classList.add('active');
    grid.appendChild(sw);
  });
}

function buildFlowerUI() {
  const tabsEl = document.getElementById('flower-tabs');
  const container = document.getElementById('flower-color-container');
  Object.keys(DATA.flowers).forEach(type => {
    const tab = document.createElement('div');
    tab.className = 'ftab' + (type === state.flowerType ? ' active' : '');
    tab.textContent = type;
    tab.addEventListener('click', () => {
      state.flowerType = type;
      state.flower = DATA.flowers[type][0];
      updateCenterpiece(); renderSummary();
      document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.flower-colors').forEach(d => d.classList.remove('visible'));
      document.getElementById('fc-' + type.replace(/\s/g,'_')).classList.add('visible');
      document.querySelectorAll('.flower-swatch').forEach(s => s.classList.remove('active'));
      const first = document.getElementById('sw-' + state.flower.id);
      if (first) first.classList.add('active');
    });
    tabsEl.appendChild(tab);

    const colDiv = document.createElement('div');
    colDiv.id = 'fc-' + type.replace(/\s/g,'_');
    colDiv.className = 'flower-colors' + (type === state.flowerType ? ' visible' : '');
    DATA.flowers[type].forEach(item => {
      const sw = createSwatch(item, () => {
        state.flower = item;
        state.flowerType = type;
        updateCenterpiece(); renderSummary();
        document.querySelectorAll('.flower-swatch').forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
      });
      sw.querySelector('.swatch-color').style.background = colorToHex(item.color);
      sw.classList.add('flower-swatch');
      sw.id = 'sw-' + item.id;
      if (item.id === state.flower.id) sw.classList.add('active');
      colDiv.appendChild(sw);
    });
    container.appendChild(colDiv);
  });
}

// ═══════════════════════════════════════════════════════════
//  RESIZE + RENDER LOOP
// ═══════════════════════════════════════════════════════════
function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

let userInteracted = false;
controls.addEventListener('start', () => {
  userInteracted = true;
  controls.autoRotate = false;
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
buildLinenSwatches();
buildSeatSwatches();
buildPlateSwatches();
buildNapkinSwatches();
buildNapkinRingSwatches();
buildFlowerUI();
renderSummary();

setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
}, 300);
</script>
</body>
</html>
